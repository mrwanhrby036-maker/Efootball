<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>PES AI PRO — ADMIN CONTROL</title>
<link rel="icon" href="images/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#060606;--bg2:#0e0e0e;--gold:#D4AF37;--goldl:#F5D778;--w:#fff;--g:#888;
    --line:rgba(212,175,55,.22);--glass:rgba(255,255,255,.05);--danger:#e5484d;--ok:#35c07f;--r:16px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Almarai',system-ui,sans-serif;background:var(--bg);color:var(--w);min-height:100dvh;overflow-x:hidden;line-height:1.6}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  h1,h2,h3,h4,p{margin:0;line-height:1.3}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#0b0b0b}
  ::-webkit-scrollbar-thumb{background:linear-gradient(#5d4a14,#D4AF37);border-radius:8px}
  .bg{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(90% 70% at 80% -10%,rgba(212,175,55,.13),transparent 60%),
    radial-gradient(70% 60% at 0% 100%,rgba(120,95,25,.12),transparent 60%),#060606}
  .bg::after{content:'';position:absolute;inset:0;opacity:.13;background-image:linear-gradient(rgba(212,175,55,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.2) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at 70% 20%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 70% 20%,#000,transparent 70%)}
  .hidden{display:none!important}

  /* ── login ── */
  .login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}
  .login-card{width:100%;max-width:400px;padding:30px 24px;border-radius:22px;background:linear-gradient(160deg,rgba(22,19,13,.96),rgba(8,8,8,.98));border:1px solid var(--line);box-shadow:0 40px 90px -40px #000}
  .login-logo{width:74px;margin:0 auto 14px;display:block;filter:drop-shadow(0 0 22px rgba(212,175,55,.5))}
  .login-card h1{font-family:'Oxanium';font-size:19px;text-align:center;letter-spacing:.08em;background:linear-gradient(135deg,#8a6d1f,#D4AF37 35%,#F5D778 50%,#D4AF37 65%,#8a6d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .login-sub{text-align:center;font-size:10.5px;letter-spacing:.24em;color:var(--g);margin:6px 0 22px;font-family:'Oxanium'}
  label{display:block;font-size:12px;color:#b3ad9f;margin-bottom:11px}
  .input{width:100%;padding:11px 13px;border-radius:11px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.13);font-size:13.5px;color:#fff;outline:none;margin-top:5px}
  .input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.14)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;transition:.2s}
  .btn.gold{background:linear-gradient(135deg,#8a6d1f,#D4AF37 35%,#F5D778 50%,#D4AF37 65%,#8a6d1f);color:#0b0902;box-shadow:0 10px 24px -12px rgba(212,175,55,.9)}
  .btn.ghost{background:var(--glass);border:1px solid rgba(212,175,55,.28);color:#efe9da}
  .btn.danger{background:linear-gradient(135deg,#7a1b1e,#e5484d);color:#fff}
  .btn.sm{padding:7px 12px;font-size:11.5px;border-radius:9px}
  .btn.full{width:100%}
  .btn:disabled{opacity:.45;pointer-events:none}
  .msg{font-size:12px;margin-top:10px;border-radius:9px;padding:0;transition:.2s}
  .msg.show{padding:9px 11px;border:1px solid transparent}
  .msg.err{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.35);color:#ff9ea0}
  .msg.ok{background:rgba(53,192,127,.1);border-color:rgba(53,192,127,.3);color:#7ee2b0}

  /* ── shell ── */
  .shell{display:grid;grid-template-columns:1fr;min-height:100dvh}
  .side{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(8,8,8,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);overflow-x:auto}
  .side-logo{width:32px;height:32px;object-fit:contain;flex:none;filter:drop-shadow(0 0 10px rgba(212,175,55,.5))}
  .side-title{font-family:'Oxanium';font-size:11px;letter-spacing:.14em;color:var(--goldl);white-space:nowrap;flex:none}
  .side-title i{display:block;font-size:8px;color:var(--g);letter-spacing:.2em;font-style:normal}
  .nav{display:flex;gap:5px;flex:1;overflow-x:auto}
  .nav button{padding:8px 11px;border-radius:9px;font-size:11.5px;color:#8f8b81;white-space:nowrap;transition:.2s}
  .nav button.active{background:rgba(212,175,55,.16);color:var(--goldl);font-weight:700}
  .nav button:hover{color:#d9d3c4}
  .side-out{flex:none;font-size:11px;padding:7px 11px;border-radius:9px;border:1px solid rgba(229,72,77,.3);color:#ff9ea0}

  .main{padding:16px 14px 60px;max-width:1280px;margin:0 auto}
  .page-head{margin-bottom:16px}
  .page-head h2{font-family:'Oxanium';font-size:clamp(18px,4.5vw,25px);letter-spacing:.03em;background:linear-gradient(135deg,#8a6d1f,#D4AF37 40%,#F5D778 55%,#D4AF37 70%,#8a6d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .page-head p{font-size:12.5px;color:var(--g);margin-top:3px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .kpi{padding:14px;border-radius:14px;background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(212,175,55,.16)}
  .kpi span{font-size:10.5px;color:var(--g);display:block}
  .kpi b{font-family:'Oxanium';font-size:23px;color:var(--goldl);line-height:1.2}
  .kpi small{font-size:9.5px;color:#6f6c64}

  .panel{border-radius:var(--r);padding:16px;margin-bottom:14px;background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(255,255,255,.013));border:1px solid rgba(255,255,255,.08)}
  .panel h3{font-size:13.5px;margin-bottom:12px;color:#f4efe2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h3 small{font-size:10.5px;color:var(--g);font-weight:400}
  .grid-2{display:grid;grid-template-columns:1fr;gap:10px}
  .grid-3{display:grid;grid-template-columns:1fr;gap:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

  .table-wrap{overflow-x:auto;margin:0 -4px}
  table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:640px}
  th{text-align:right;font-size:10px;letter-spacing:.06em;color:var(--g);font-weight:400;padding:8px 9px;border-bottom:1px solid rgba(212,175,55,.2);white-space:nowrap}
  td{padding:9px;border-bottom:1px solid rgba(255,255,255,.055);vertical-align:middle}
  tr:hover td{background:rgba(212,175,55,.035)}
  .tag{font-size:9.5px;padding:2px 8px;border-radius:99px;font-family:'Oxanium';white-space:nowrap;display:inline-block}
  .tag.ok{background:rgba(53,192,127,.14);color:#7ee2b0;border:1px solid rgba(53,192,127,.3)}
  .tag.pend{background:rgba(212,175,55,.16);color:var(--goldl);border:1px solid var(--line)}
  .tag.bad{background:rgba(229,72,77,.14);color:#ff9ea0;border:1px solid rgba(229,72,77,.3)}
  .tag.mut{background:rgba(255,255,255,.06);color:#a9a496;border:1px solid rgba(255,255,255,.1)}
  .mini{font-size:10px;color:#7d7a72}
  .empty{text-align:center;color:var(--g);font-size:12.5px;padding:26px 10px}

  .search{display:flex;gap:8px;margin-bottom:10px}
  .search .input{margin:0;flex:1}
  .prod-mini{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid rgba(255,255,255,.1);background:#111}
  .switch{appearance:none;width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;transition:.2s;flex:none}
  .switch::after{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#8e8a80;transition:.2s}
  .switch:checked{background:rgba(212,175,55,.4)}
  .switch:checked::after{right:19px;background:var(--goldl);box-shadow:0 0 9px rgba(212,175,55,.8)}

  .modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);backdrop-filter:blur(7px);display:grid;place-items:center;padding:16px;overflow-y:auto}
  .modal{width:100%;max-width:520px;border-radius:18px;padding:20px;background:linear-gradient(160deg,#171410,#0a0a0a);border:1px solid var(--line);box-shadow:0 40px 90px -40px #000;max-height:92dvh;overflow-y:auto}
  .modal h3{font-size:14.5px;margin-bottom:12px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:150;display:grid;gap:7px;width:calc(100% - 28px);max-width:400px}
  .toast{padding:10px 13px;border-radius:11px;font-size:12px;background:linear-gradient(150deg,#181610,#090909);border:1px solid var(--line);box-shadow:0 16px 36px -18px #000;animation:tin .25s both}
  .toast.err{border-color:rgba(229,72,77,.5);color:#ffb3b4}
  .toast.ok{border-color:rgba(53,192,127,.45);color:#8fe9bd}
  @keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(min-width:820px){
    .shell{grid-template-columns:210px 1fr}
    .side{position:sticky;top:0;height:100dvh;flex-direction:column;align-items:stretch;border-bottom:0;border-left:1px solid var(--line);padding:16px 12px;overflow:visible}
    .nav{flex-direction:column;overflow:visible;margin-top:16px}
    .nav button{text-align:right;padding:9px 12px;font-size:12px}
    .side-out{margin-top:auto}
    .grid-2{grid-template-columns:1fr 1fr}
    .grid-3{grid-template-columns:repeat(3,1fr)}
    .main{padding:26px 24px 60px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- تسجيل دخول الأدمن -->
<div class="login-wrap" id="loginWrap">
  <form class="login-card" id="adminLogin" novalidate>
    <img src="images/icon.png" alt="" class="login-logo" />
    <h1>PES AI PRO</h1>
    <div class="login-sub">ADMIN CONTROL PANEL</div>
    <label>البريد الإداري<input id="aEmail" class="input" inputmode="email" autocomplete="username" placeholder="admin@example.com" required /></label>
    <label>كلمة مرور الأدمن<input id="aPass" class="input" type="password" autocomplete="current-password" required /></label>
    <label id="phoneWrap">رقم التحقق الإضافي (لو فعّلته)<input id="aPhone" class="input" inputmode="tel" placeholder="01xxxxxxxxx" /></label>
    <button class="btn gold full" type="submit" id="aLoginBtn">دخول لوحة التحكم</button>
    <div class="msg" id="aMsg"></div>
    <p style="font-size:10.5px;color:#5f5c56;margin-top:16px;text-align:center;line-height:1.7">
      الدخول مقصور على الحساب الإداري المصرّح بيه في Firestore.<br>كل المحاولات الفاشلة محدودة ومسجّلة.
    </p>
  </form>
</div>

<!-- اللوحة -->
<div class="shell hidden" id="shell">
  <aside class="side">
    <img src="images/icon.png" alt="" class="side-logo" />
    <div class="side-title">ADMIN<i>PES AI PRO</i></div>
    <nav class="nav" id="nav"></nav>
    <button class="side-out" id="logoutBtn" type="button">خروج</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal-back hidden" id="modalBack"><div class="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
<div class="toasts" id="toasts"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   PES AI PRO — ADMIN (تطبيق مستقل تمامًا عن واجهة المستخدم)
   الصلاحية الحقيقية محفوظة في Firestore: users/{uid}.role === 'admin'
   وكل قراءة/كتابة محمية بـ firestore.rules — مش بمجرد إخفاء الأزرار.
   ═══════════════════════════════════════════════════════════════ */

/* تحميل Firebase — من الملف المحلي، ولو مش موجود يرجع لـ CDN الرسمي */
const FIREBASE_LOCAL = './vendor/firebase.js';
const FIREBASE_CDN = 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
async function loadFirebase() {
  try {
    return await import(FIREBASE_LOCAL);
  } catch (err) {
    console.warn('حزمة Firebase المحلية مش موجودة — بنستخدم CDN', err);
    const [appMod, authMod, fsMod] = await Promise.all([
      import(FIREBASE_CDN),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')
    ]);
    return {
      initializeApp: appMod.initializeApp, getApps: appMod.getApps,
      getAuth: authMod.getAuth, signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
      signOut: authMod.signOut, onAuthStateChanged: authMod.onAuthStateChanged,
      getFirestore: fsMod.getFirestore, doc: fsMod.doc, getDoc: fsMod.getDoc, setDoc: fsMod.setDoc,
      addDoc: fsMod.addDoc, updateDoc: fsMod.updateDoc, deleteDoc: fsMod.deleteDoc,
      collection: fsMod.collection, getDocs: fsMod.getDocs, query: fsMod.query, where: fsMod.where,
      orderBy: fsMod.orderBy, limit: fsMod.limit, serverTimestamp: fsMod.serverTimestamp,
      Timestamp: fsMod.Timestamp, increment: fsMod.increment, writeBatch: fsMod.writeBatch,
      deleteField: fsMod.deleteField
    };
  }
}
const FB = await loadFirebase();
const {
  initializeApp, getApps, getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, getDocs,
  query, where, orderBy, limit, serverTimestamp, Timestamp, increment, writeBatch, deleteField
} = FB;

/* ── نفس إعدادات المشروع (لازم يطابق app.js) ── */
const FIREBASE_CONFIG = {
  apiKey: "PUT_API_KEY_HERE",
  authDomain: "PUT_AUTH_DOMAIN_HERE",
  projectId: "PUT_PROJECT_ID_HERE",
  storageBucket: "PUT_STORAGE_BUCKET_HERE",
  messagingSenderId: "PUT_MESSAGING_SENDER_ID_HERE",
  appId: "PUT_APP_ID_HERE"
};
const CONFIGURED = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PUT_');

const qs = (s, r = document) => r.querySelector(s);
const qsa = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lc = (s) => String(s || '').toLowerCase().trim();
const num = (n) => Number(n || 0).toLocaleString('ar-EG');
const money = (n) => `${num(n)} ج.م`;
const clampNum = (n, a, b) => Math.min(b, Math.max(a, Number(n) || 0));
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  return isNaN(d) ? '—' : d.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric', year: '2-digit' });
}
function fmtDT(ts) {
  if (!ts) return '—';
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  return isNaN(d) ? '—' : d.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
}

let app, auth, db;
if (CONFIGURED) {
  app = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  db = getFirestore(app);
}

/* ── UI helpers ── */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = (type === 'err' ? '⚠️ ' : type === 'ok' ? '✅ ' : 'ℹ️ ') + msg;
  qs('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 4000);
}
function modal(title, bodyHtml, actions = [{ label: 'حسناً', value: true, cls: 'gold' }]) {
  return new Promise(res => {
    qs('#modalTitle').textContent = title;
    qs('#modalBody').innerHTML = bodyHtml;
    const act = qs('#modalActions');
    act.innerHTML = '';
    const close = (v) => { qs('#modalBack').classList.add('hidden'); res(v); };
    actions.forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.cls || 'ghost');
      b.textContent = a.label;
      b.onclick = () => close(a.value);
      act.appendChild(b);
    });
    qs('#modalBack').classList.remove('hidden');
    qs('#modalBack').onclick = (e) => { if (e.target.id === 'modalBack') close(false); };
  });
}
const confirmBox = (t, b, danger = false) => modal(t, b, [
  { label: 'إلغاء', value: false, cls: 'ghost' },
  { label: danger ? 'نعم، احذف' : 'تأكيد', value: true, cls: danger ? 'danger' : 'gold' }
]);

function authErr(e) {
  const map = {
    'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة.',
    'auth/wrong-password': 'كلمة المرور غير صحيحة.',
    'auth/user-not-found': 'مفيش حساب بالبريد ده.',
    'auth/too-many-requests': 'محاولات كتير — استنى شوية.',
    'auth/invalid-email': 'البريد غير صالح.',
    'auth/network-request-failed': 'مشكلة في الاتصال.'
  };
  for (const k in map) if (String(e?.code || '').includes(k)) return map[k];
  return e?.message || 'خطأ غير متوقع';
}
function setMsg(txt, type = '') {
  const el = qs('#aMsg');
  el.textContent = txt || '';
  el.className = 'msg' + (txt ? ' show ' + type : '');
}

/* ── الحالة ── */
const S = {
  me: null, profile: null, page: 'overview',
  users: [], orders: [], products: [], players: [], admins: [], logs: [], plans: {}, config: {},
  search: ''
};

/* ═══════════════ الدخول ═══════════════ */
qs('#adminLogin').onsubmit = async (e) => {
  e.preventDefault();
  const email = lc(qs('#aEmail').value);
  const pass = qs('#aPass').value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMsg('اكتب البريد الإداري صح', 'err');
  if (!pass) return setMsg('اكتب كلمة مرور الأدمن', 'err');
  const btn = qs('#aLoginBtn'); btn.disabled = true; btn.textContent = 'جارٍ التحقق…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    setMsg('');
  } catch (err) {
    setMsg(authErr(err), 'err');
    await logAttempt(email, false, err?.code || '');
  } finally { btn.disabled = false; btn.textContent = 'دخول لوحة التحكم'; }
};

async function logAttempt(email, ok, reason) {
  try {
    await addDoc(collection(db, 'adminAudit'), {
      action: ok ? 'admin_login' : 'admin_login_failed',
      email, reason, at: serverTimestamp()
    });
  } catch {}
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { showLogin(); return; }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists() || snap.data().role !== 'admin' || snap.data().status === 'blocked') {
      await signOut(auth);
      setMsg('الحساب ده مش مصرّح له بالدخول للوحة التحكم.', 'err');
      showLogin();
      return;
    }
    S.me = user;
    S.profile = { uid: user.uid, ...snap.data() };
    await logAttempt(user.email, true, '');
    qs('#loginWrap').classList.add('hidden');
    qs('#shell').classList.remove('hidden');
    qs('#logoutBtn').onclick = async () => {
      if (!await confirmBox('خروج', 'تسجيل الخروج من لوحة التحكم؟')) return;
      await signOut(auth);
    };
    buildNav();
    await loadAll();
    render();
  } catch (err) {
    console.error(err);
    setMsg('خطأ في التحقق: ' + (err?.message || err), 'err');
    await signOut(auth).catch(() => {});
    showLogin();
  }
});

function showLogin() {
  qs('#shell').classList.add('hidden');
  qs('#loginWrap').classList.remove('hidden');
  qs('#aPass').value = '';
}

/* ═══════════════ التنقل ═══════════════ */
const PAGES = [
  ['overview', 'نظرة عامة'],
  ['users', 'المستخدمين'],
  ['orders', 'الطلبات'],
  ['products', 'المتجر'],
  ['plans', 'الاشتراكات'],
  ['players', 'اللاعبين'],
  ['notifs', 'الإشعارات'],
  ['ai', 'تقارير AI'],
  ['settings', 'الإعدادات'],
  ['audit', 'سجل العمليات']
];

function buildNav() {
  qs('#nav').innerHTML = PAGES.map(([k, l]) => `<button data-page="${k}" class="${S.page === k ? 'active' : ''}">${l}</button>`).join('');
  qsa('#nav button').forEach(b => b.onclick = async () => {
    S.page = b.dataset.page;
    S.search = '';
    buildNav();
    render();
    // تحديث البيانات من قاعدة البيانات عند كل فتح صفحة
    try { await loadAll(); render(); } catch (e) { console.warn('refresh failed', e); }
  });
}

/* ═══════════════ تحميل البيانات ═══════════════ */
async function loadAll() {
  const safe = async (p, fb = { docs: [] }) => { try { return await p; } catch (e) { console.warn(e); return fb; } };
  const [users, orders, products, players, admins, logs, cfg, plans] = await Promise.all([
    safe(getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc'), limit(500)))),
    safe(getDocs(query(collection(db, 'orders'), orderBy('createdAt', 'desc'), limit(300)))),
    safe(getDocs(query(collection(db, 'products'), orderBy('sort', 'asc')))),
    safe(getDocs(query(collection(db, 'players'), orderBy('name', 'asc'), limit(1000)))),
    safe(getDocs(collection(db, 'admins'))),
    safe(getDocs(query(collection(db, 'adminAudit'), orderBy('at', 'desc'), limit(120)))),
    safe(getDoc(doc(db, 'config', 'main'))),
    safe(getDoc(doc(db, 'config', 'plans')))
  ]);
  S.users = users.docs.map(d => ({ id: d.id, ...d.data() }));
  S.orders = orders.docs.map(d => ({ id: d.id, ...d.data() }));
  S.products = products.docs.map(d => ({ id: d.id, ...d.data() }));
  S.players = players.docs.map(d => ({ id: d.id, ...d.data() }));
  S.admins = admins.docs.map(d => ({ id: d.id, ...d.data() }));
  S.logs = logs.docs.map(d => ({ id: d.id, ...d.data() }));
  S.config = cfg.exists() ? cfg.data() : {};
  S.plans = plans.exists() ? plans.data() : {};
}

async function reload() { await loadAll(); render(); }

/* ═══════════════ الرسم ═══════════════ */
function render() {
  const m = qs('#main');
  switch (S.page) {
    case 'overview': m.innerHTML = viewOverview(); bindOverview(); break;
    case 'users': m.innerHTML = viewUsers(); bindUsers(); break;
    case 'orders': m.innerHTML = viewOrders(); bindOrders(); break;
    case 'products': m.innerHTML = viewProducts(); bindProducts(); break;
    case 'plans': m.innerHTML = viewPlans(); bindPlans(); break;
    case 'players': m.innerHTML = viewPlayers(); bindPlayers(); break;
    case 'notifs': m.innerHTML = viewNotifs(); bindNotifs(); break;
    case 'ai': m.innerHTML = viewAi(); break;
    case 'settings': m.innerHTML = viewSettings(); bindSettings(); break;
    case 'audit': m.innerHTML = viewAudit(); break;
  }
}

function bindOverview() {
  qsa('[data-quick-approve]').forEach(b => b.onclick = () => approveOrder(b.dataset.quickApprove));

function currentPlan(u) {
  if (u.plan !== 'PRO') return 'FREE';
  if (!u.planExpiresAt) return 'PRO';
  const exp = u.planExpiresAt.toDate ? u.planExpiresAt.toDate() : new Date(u.planExpiresAt);
  return exp.getTime() > Date.now() ? 'PRO' : 'FREE';
}

/* ── المستخدمين ── */
function viewUsers() {

function userRowHtml(u) {

function bindUserRowActions() {
  qsa('[data-toggle-user]').forEach(b => b.onclick = async () => {
    const u = S.users.find(x => x.id === b.dataset.toggleUser);
    if (!u) return;
    if (u.id === S.me.uid) return toast('مش ممكن توقف حسابك انت — ده هيقفل اللوحة عليك', 'err');
    if (u.role === 'admin' && u.status !== 'blocked' && !await confirmBox('إيقاف أدمن آخر', 'الحساب ده أدمن — متأكد إنك عايز توقفه؟', true)) return;
    const block = u.status !== 'blocked';
    if (!await confirmBox(block ? 'إيقاف الحساب' : 'تفعيل الحساب',
      block ? 'هيتم منع الدخول فورًا. البيانات والاشتراك بيفضلوا محفوظين.' : 'الحساب هيرجع يدخل عادي.', block)) return;
    await updateDoc(doc(db, 'users', u.id), { status: block ? 'blocked' : 'active', statusChangedAt: serverTimestamp() });
    await audit(block ? 'user_blocked' : 'user_activated', u.id, u.name);
    toast(block ? 'تم إيقاف الحساب' : 'تم تفعيل الحساب', 'ok');
    await reload();
  });
  qsa('[data-edit-user]').forEach(b => b.onclick = () => editUser(b.dataset.editUser));
}

function bindUsers() {
  const s = qs('#uSearch');
  if (s) s.oninput = () => { S.search = s.value; renderUsersTable(); };

  bindUserRowActions();
}

async function editUser(uid) {
  const u = S.users.find(x => x.id === uid);
  if (!u) return;
  const ok = await modal(`تعديل: ${esc(u.name)}`, `
    <label>الاسم<input id="euName" class="input" value="${esc(u.name || '')}" /></label>
    <label>الموبايل<input id="euPhone" class="input" value="${esc(u.phone || '')}" /></label>
    <label>الباقة
      <select id="euPlan" class="input">
        <option value="FREE" ${u.plan !== 'PRO' ? 'selected' : ''}>FREE</option>
        <option value="PRO" ${u.plan === 'PRO' ? 'selected' : ''}>PRO</option>
      </select>
    </label>
    <label>تاريخ انتهاء PRO (اتركه فاضي = مفتوح)
      <input id="euExp" class="input" type="date" value="${u.planExpiresAt?.toDate ? u.planExpiresAt.toDate().toISOString().slice(0, 10) : ''}" />
    </label>
    <label>ملاحظة إدارية (تظهر للأدمن فقط)
      <textarea id="euNote" class="input" rows="2">${esc(u.adminNote || '')}</textarea>
    </label>
    <p class="mini" style="margin-top:8px">أي تغيير هنا بيتسجل في سجل العمليات.</p>`,
    [{ label: 'إلغاء', value: false }, { label: 'حفظ', value: true, cls: 'gold' }]);
  if (!ok) return;
  const payload = {
    name: qs('#euName').value.trim().slice(0, 60),
    phone: qs('#euPhone').value.replace(/[^\d]/g, ''),
    plan: qs('#euPlan').value,
    adminNote: qs('#euNote').value.trim().slice(0, 300),
    updatedAt: serverTimestamp()
  };
  const expVal = qs('#euExp').value;
  if (expVal) {
    const dt = new Date(expVal + 'T23:59:59');
    payload.planExpiresAt = Timestamp.fromDate(dt);
    if (payload.plan === 'FREE') payload.plan = 'PRO';
  } else if (payload.plan === 'PRO') {
    payload.planExpiresAt = null;
  }
  await updateDoc(doc(db, 'users', uid), payload);
  await audit('user_updated', uid, payload.name);
  await notifyUser(uid, 'تم تحديث حسابك', 'الإدارة حدثت بيانات حسابك. راجع صفحة حسابي.');
  toast('تم حفظ بيانات المستخدم', 'ok');
  await reload();
}

async function approveOrder(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o) return;
  const ok = await modal('تأكيد الدفع', `
    <p>هتأكد استلام <b>${money(o.total)}</b> من <b>${esc(o.userName)}</b>؟</p>
    ${o.type === 'plan' ? `<p class="mini" style="margin-top:8px">هيتم تفعيل <b>${esc(o.items?.[0]?.name || 'PRO')}</b> لمدة <b>${o.items?.[0]?.days || 30}</b> يوم من الآن.</p>` : '<p class="mini" style="margin-top:8px">إتمام الخدمة هيتسجل، والمستخدم هيتشعر بالإشعار.</p>'}
    <label style="margin-top:12px">ملاحظة للمستخدم (اختياري)<input id="apprNote" class="input" placeholder="مثلاً: تم استلام التحويل ✅" /></label>`,
    [{ label: 'إلغاء', value: false }, { label: 'تأكيد الدفع', value: true, cls: 'gold' }]);
  if (!ok) return;
  const note = qs('#apprNote')?.value?.trim() || '';
  const upd = { status: 'confirmed', adminNote: note, confirmedAt: serverTimestamp(), updatedAt: serverTimestamp() };

  if (o.type === 'plan') {
    const days = Number(o.items?.[0]?.days) || Number(S.plans?.pro?.days) || 30;
    const uSnap = await getDoc(doc(db, 'users', o.userId));
    const u = uSnap.exists() ? uSnap.data() : {};
    let base = Date.now();
    if (u.planExpiresAt?.toDate) {
      const cur = u.planExpiresAt.toDate().getTime();
      if (cur > base) base = cur;
    }
    upd.planExpiresAt = Timestamp.fromDate(new Date(base + days * 864e5));
    await updateDoc(doc(db, 'users', o.userId), { plan: 'PRO', planExpiresAt: upd.planExpiresAt, updatedAt: serverTimestamp() });
    await notifyUser(o.userId, 'تم تفعيل اشتراك PRO 💎', `اشتراكك اتفعل لحد ${fmtDate(upd.planExpiresAt)}. استمتع بكل الأدوات.`);
  } else {
    await notifyUser(o.userId, 'تم تأكيد طلبك ✅', `طلبك بقيمة ${money(o.total)} اتأكد. فريقنا هيتواصل معاك لتنفيذ الخدمة.`);
  }
  await updateDoc(doc(db, 'orders', id), upd);
  await audit('order_approved', id, `${o.userName} — ${o.total}`);
  toast('تم تأكيد الطلب وتفعيله', 'ok');
  await reload();
}

async function rejectOrder(id) {
  const ok = await modal('رفض الطلب', `<label>سبب الرفض (هيوصل للمستخدم)<input id="rejReason" class="input" placeholder="مثلاً: مفيش إثبات دفع" /></label>`,
    [{ label: 'إلغاء', value: false }, { label: 'رفض', value: true, cls: 'danger' }]);
  if (!ok) return;
  const reason = qs('#rejReason')?.value?.trim() || 'تم رفض الطلب من الإدارة';
  const o = S.orders.find(x => x.id === id);
  await updateDoc(doc(db, 'orders', id), { status: 'rejected', adminNote: reason, updatedAt: serverTimestamp() });
  if (o) await notifyUser(o.userId, 'طلبك اتـرفض', reason);
  await audit('order_rejected', id, reason);
  toast('تم رفض الطلب', 'ok');
  await reload();
}

  await reload();
}

  qsa('[data-del-player]').forEach(b => b.onclick = async () => {
    if (!await confirmBox('حذف اللاعب', 'هيختفي من قاعدة الباني.', true)) return;
    await deleteDoc(doc(db, 'players', b.dataset.delPlayer));
    await audit('player_deleted', b.dataset.delPlayer, '');
    toast('تم الحذف', 'ok');

  });
}

function bindPlayers() {
  const s = qs('#pSearch');
  if (s) s.oninput = () => { S.search = s.value; renderPlayersTable(); };
  qs('#addPlayerBtn').onclick = async () => {
    const name = qs('#nplName').value.trim();
    const rating = clampNum(qs('#nplRating').value, 1, 110);
    const positions = qs('#nplPos').value.split(/[,،\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean).slice(0, 6);
    if (name.length < 2) return toast('اسم اللاعب مطلوب', 'err');
    await addDoc(collection(db, 'players'), { name, rating: rating || null, positions, createdAt: serverTimestamp() });
    await audit('player_added', '', name);
    toast('تمت إضافة اللاعب', 'ok');
    S.search = '';
    await reload();
  };
  qs('#bulkToggle').onclick = () => qs('#bulkBox').classList.toggle('hidden');
  qs('#bulkAdd').onclick = async () => {
    const lines = qs('#bulkCsv').value.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return toast('مفيش بيانات', 'err');
    const btn = qs('#bulkAdd'); btn.disabled = true;
    let added = 0;
    for (const l of lines.slice(0, 500)) {
      const [name, rating, pos] = l.split(',').map(x => (x || '').trim());
      if (!name) continue;
      await addDoc(collection(db, 'players'), {
        name: name.slice(0, 40),
        rating: rating ? clampNum(rating, 1, 110) : null,
        positions: (pos || '').split(/\s+/).map(x => x.toUpperCase()).filter(Boolean).slice(0, 6),
        createdAt: serverTimestamp()
      });
      added++;
    }
    await audit('players_bulk_import', '', `${added} لاعب`);
    toast(`تم استيراد ${added} لاعب`, 'ok');
    btn.disabled = false;
    S.search = '';
    await reload();
  };
  bindPlayerRowActions();
}

function bindNotifs() {
  qs('#sendNotifBtn').onclick = async () => {
    const target = qs('#nfTarget').value;
    const title = qs('#nfTitle').value.trim();
    const body = qs('#nfBody').value.trim();
    const type = qs('#nfType').value;
    if (title.length < 3) return toast('العنوان قصير', 'err');
    if (body.length < 3) return toast('النص قصير', 'err');
    const btn = qs('#sendNotifBtn'); btn.disabled = true; btn.textContent = 'بيبعت…';
    const ids = target === 'all' ? S.users.map(u => u.id) : [target];
    let sent = 0;
    for (const uid of ids) {
      try {
        await addDoc(collection(db, 'users', uid, 'notifications'), {
          type, title: title.slice(0, 90), body: body.slice(0, 500),
          read: false, createdAt: serverTimestamp(), fromAdmin: true
        });
        sent++;
      } catch {}
    }
    await audit('notification_sent', target === 'all' ? 'all' : target, `${title} (${sent})`);
    toast(`تم إرسال ${sent} إشعار`, 'ok');
    btn.disabled = false; btn.textContent = 'إرسال';
    qs('#nfTitle').value = ''; qs('#nfBody').value = '';
  };
}

      <p class="mini" style="margin-top:6px">الحساب الإداري: <b style="color:#F5D778">${esc(S.profile?.email || '')}</b> — الصلاحية مخزنة في users/${S.me?.uid?.slice(0, 8)}… role=admin</p>
    </div>`;
}
function bindSettings() {
  qs('#saveSocial').onclick = async () => {
    const wa = qs('#cfgWa').value.replace(/[^\d]/g, '');
    const tg = qs('#cfgTg').value.trim();
    if (tg && !/^(https?:\/\/)?(t\.me|telegram\.me)\//i.test(tg)) return toast('رابط تليجرام لازم يكون t.me/username', 'err');
    await setDoc(doc(db, 'config', 'main'), { whatsapp: wa, telegram: tg }, { merge: true });
    await audit('config_social_updated', '', wa ? 'wa=' + wa : 'wa=—');
    toast('تم حفظ بيانات التواصل', 'ok');
    await reload();
  };
  qs('#savePay').onclick = async () => {
    await setDoc(doc(db, 'config', 'main'), {
      paymentMethods: qs('#cfgPay').value.trim().slice(0, 120),
      paymentPhone: qs('#cfgPayPhone').value.trim().slice(0, 40),
      geminiModel: qs('#cfgModel').value.trim().slice(0, 60) || 'gemini-2.5-flash',
      adminEmail: qs('#cfgAdminEmail').value.trim().slice(0, 80)
    }, { merge: true });
    await audit('config_payment_updated', '', '');
    toast('تم الحفظ', 'ok');
    await reload();
  };
}

/* ── سجل العمليات ── */
function viewAudit() {
  return `
    <div class="page-head"><h2>سجل العمليات الإدارية</h2><p>كل إجراء حساس بيتسجل: مين عمله وإمتى — ${num(S.logs.length)} عملية.</p></div>
    <div class="panel">
      <div class="table-wrap"><table>
        <thead><tr><th>الوقت</th><th>الإجراء</th><th>الهدف</th><th>تفاصيل</th><th>البريد</th></tr></thead>
        <tbody>${S.logs.map(l => `<tr>
          <td class="mini">${fmtDT(l.at)}</td>
          <td><span class="tag ${String(l.action).includes('fail') ? 'bad' : 'mut'}">${esc(l.action)}</span></td>
          <td class="mini" style="direction:ltr;text-align:right">${esc(String(l.target || '').slice(0, 14))}</td>
          <td class="mini">${esc(l.details || l.reason || '')}</td>
          <td class="mini">${esc(l.email || '')}</td>
        </tr>`).join('') || '<tr><td colspan="5" class="empty">مفيش سجلات لسه</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

/* ═══════════════ أدوات مساعدة ═══════════════ */
async function audit(action, target, details) {
  try {
    await addDoc(collection(db, 'adminAudit'), {
      action, target: String(target || ''), details: String(details || '').slice(0, 200),
      adminUid: S.me.uid, email: S.profile?.email || S.me.email || '', at: serverTimestamp()
    });
  } catch (e) { console.warn('audit failed', e); }
}
async function notifyUser(uid, title, body, type = 'admin') {
  try {
    await addDoc(collection(db, 'users', uid, 'notifications'), {
      type, title, body, read: false, createdAt: serverTimestamp(), fromAdmin: true
    });
  } catch (e) { console.warn('notify failed', e); }
}
